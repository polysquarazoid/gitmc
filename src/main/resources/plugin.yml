name: gitmc
version: ${version}
main: com.gitmc.GitmcPlugin
api-version: '26.2'
description: Pull a Git repo and reload the server.
author: Polysquarazoid
commands:
  git:
    description: Pull a Git repo and reload.
    usage: /git <pull|version|help>
permissions:
  gitmc.use:
    description: Allows use of /git.
    default: op
